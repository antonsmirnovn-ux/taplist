<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тап-лист на ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: TV board, 16:9 landscape, two columns of taps that fill the screen; one column on phones */
:root{
  --bg:#17110c;
  --line:#3a2b1e;
  --fg:#f3e7d6;
  --muted:#b49b80;
  --dim:#7d6650;
  --amber:#f0a432;
  --amber-ink:#1d1307;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden;
}
.board{height:100%;display:flex;flex-direction:column;gap:1.2vh;padding-block:2vh 1.6vh;max-width:1900px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--line);padding-bottom:1.1vh}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,58px);letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 span{color:var(--amber)}
.meta{display:flex;flex-wrap:wrap;gap:2vw;align-items:baseline;color:var(--muted);font-size:clamp(12px,1.05vw,21px);font-variant-numeric:tabular-nums;white-space:nowrap}
#clock{font-family:var(--display);font-weight:500;color:var(--fg);font-size:clamp(16px,1.9vw,38px)}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;column-gap:2.6vw}
.col{min-width:0;display:flex;flex-direction:column}
.head,.tap{display:grid;grid-template-columns:clamp(34px,3.2vw,64px) minmax(0,1fr) clamp(52px,5vw,100px) clamp(96px,9vw,180px);column-gap:1.1vw;align-items:center}
.head{color:var(--dim);font-size:clamp(10px,.8vw,16px);text-transform:uppercase;letter-spacing:.1em;padding-bottom:.6vh;border-bottom:1px solid var(--line)}
.head .stats,.head .price{display:flex;justify-content:space-between;gap:.6em}
.head .stats span,.head .price span{white-space:nowrap;text-align:right;flex:1}
.taps{flex:1;min-height:0;display:grid;list-style:none;margin:0;padding:0}
.tap{min-width:0;border-bottom:1px solid var(--line);padding-block:.3vh}
.num{width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-family:var(--display);font-weight:700;font-size:clamp(13px,1.35vw,27px);font-variant-numeric:tabular-nums}
.txt{min-width:0;display:flex;flex-direction:column;gap:.25vh}
.beer{font-weight:600;font-size:clamp(16px,1.75vw,35px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:clamp(10px,.9vw,18px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--fg);opacity:.75}
.stats,.price{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.stats span{font-size:clamp(13px,1.3vw,26px);font-weight:500;color:var(--fg);text-align:right;flex:1}
.price span{font-family:var(--display);font-weight:500;font-size:clamp(13px,1.3vw,26px);color:var(--amber);text-align:right;flex:1}
.na{color:var(--dim)!important}
footer{color:var(--dim);font-size:clamp(10px,.8vw,16px);text-align:right}
.bars{display:flex;gap:4px}
.bars a{color:var(--dim);text-decoration:none;font-size:clamp(11px,.85vw,17px);padding:.3em .7em;border:1px solid var(--line);border-radius:999px}
.bars a.on{color:var(--amber-ink);background:var(--amber);border-color:var(--amber)}
.bars a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.msg{color:var(--muted);font-size:clamp(14px,1.2vw,24px)}

@media (max-width:900px), (orientation:portrait){
  body{overflow:auto}
  .board{height:auto}
  .cols{grid-template-columns:1fr;row-gap:0}
  .col+.col .head{display:none}
  .head,.tap{grid-template-columns:34px minmax(0,1fr) 56px;row-gap:6px}
  .head .price{display:none}
  .tap{padding-block:10px}
  .tap .price{grid-column:2 / 4;justify-content:flex-start;gap:14px}
  .tap .price span{flex:none;font-size:15px}
  .tap .price span::before{content:attr(data-l);font-family:var(--body);font-size:11px;color:var(--dim);margin-right:4px}
  .num{font-size:14px}
  .beer{font-size:17px;white-space:normal}
  .sub{font-size:12px;white-space:normal}
  .stats span{font-size:14px}
  .head{font-size:10px}
  .meta{font-size:12px}
}
</style>
</head>
<body>


<div class="board">
  <header>
    <h1>Сейчас <span>на кранах</span></h1>
    <div class="meta">
      <nav class="bars" id="bars"><a href="#13rules" id="b-13rules">13rules</a><a href="#epo" id="b-epo">Ещё по одной</a></nav>
      <span id="count"></span><span id="clock">--:--</span>
    </div>
  </header>
  <div class="cols" id="cols"><p class="msg">Загружаю краны…</p></div>
  <footer id="foot">Крепость, % · цены в рублях</footer>
</div>

<script>
// Данные лежат в data.json рядом со страницей: краны каждого бара из GainUp (Продажи → Краны),
// цены за литр из GainUp, стиль и крепость из Untappd. Страница перечитывает файл каждые 5 минут.
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,suf="")=>v==null?"—":String(v).replace(".",",")+suf;
const cell=(v,suf,lbl)=>`<span${v==null?' class="na"':''}${lbl?` data-l="${lbl}"`:''}>${fmt(v,suf)}</span>`;
let DATA=null, lastStamp=null;
const barId=()=>{const h=location.hash.slice(1);return DATA&&DATA.bars[h]?h:"13rules"};
function render(){
  if(!DATA) return;
  const id=barId(), bar=DATA.bars[id];
  document.querySelectorAll("#bars a").forEach(a=>a.classList.toggle("on",a.id==="b-"+id));
  const taps=bar.taps.map(([n,name,pl])=>{const b=DATA.beers[name]||[ "", name.replace(/\s*розлив\s*$/i,""), "", null ];return {n,brew:b[0],beer:b[1],style:b[2],abv:b[3],pl}});
  const half=Math.ceil(taps.length/2);
  const root=document.getElementById("cols");root.innerHTML="";
  [taps.slice(0,half),taps.slice(half)].forEach(list=>{
    const col=document.createElement("div");col.className="col";
    col.innerHTML=`<div class="head"><span>№</span><span>Сорт</span><span class="stats"><span>Крепость</span></span><span class="price"><span>0,25 л</span><span>0,4 л</span></span></div>`;
    const ul=document.createElement("ul");ul.className="taps";ul.style.gridTemplateRows=`repeat(${half},1fr)`;
    for(const t of list){
      const p25=t.pl==null?null:Math.ceil(t.pl*0.25-1e-9), p40=t.pl==null?null:Math.ceil(t.pl*0.4-1e-9);
      const li=document.createElement("li");li.className="tap";
      const sub=[t.brew&&`<b>${esc(t.brew)}</b>`,t.style&&esc(t.style)].filter(Boolean).join(" · ");
      li.innerHTML=`<div class="num">${t.n}</div>
        <div class="txt"><div class="beer">${esc(t.beer)}</div><div class="sub">${sub}</div></div>
        <div class="stats">${cell(t.abv,"%")}</div>
        <div class="price">${cell(p25,"","0,25")}${cell(p40,"","0,4")}</div>`;
      ul.appendChild(li);
    }
    col.appendChild(ul);root.appendChild(col);
  });
  document.getElementById("count").textContent=taps.length+" сортов";
  const d=new Date(DATA.updated);
  document.getElementById("foot").textContent="Крепость, % · цены в рублях · обновлено "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    if(j.updated!==lastStamp){DATA=j;lastStamp=j.updated;render();}
  }catch(e){
    if(!DATA) document.getElementById("cols").innerHTML='<p class="msg">Не удалось загрузить список кранов. Страница попробует снова через минуту.</p>';
    setTimeout(load,60000);return;
  }
}
load();setInterval(load,5*60000);
window.addEventListener("hashchange",render);
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
// раз в 6 часов перезагружаем страницу целиком, чтобы ТВ подхватывал правки оформления
setTimeout(()=>location.reload(),6*3600*1000);
</script>
</body>
</html>
