<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тап-лист на ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@600;700&family=Neucha&family=Pangolin&family=Oswald:wght@400;500;600&display=swap">
<style>
/* Layout: slate chalkboard, each tap written by hand in its own chalk color and lettering; two columns, faint chalk grid */
:root{
  --slate:#1e2325;
  --slate-2:#2c3335;
  --grid:rgba(230,236,232,.10);
  --chalk:#eef0ea;
  --dim:#b8c0bc;
  --c1:#ff9cc4; --c2:#8ff0ff; --c3:#c4ff7a; --c4:#ffe873; --c5:#ffb86b; --c6:#ffffff; --c7:#d3b5ff; --c8:#ff8f80;
  --label:"Oswald","Roboto Condensed","Arial Narrow",sans-serif;
  --hand:"Caveat","Marck Script",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--chalk);font-family:var(--label);overflow:hidden;
  background:
    radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.05),transparent 60%),
    radial-gradient(90% 70% at 80% 90%,rgba(255,255,255,.035),transparent 60%),
    var(--slate);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.board{height:100%;display:flex;flex-direction:column;gap:.8vh;padding-block:1.4vh 1vh;max-width:1900px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:.6vh;border-bottom:2px solid var(--grid)}
h1{margin:0;font-family:var(--label);font-weight:600;text-transform:uppercase;font-size:clamp(24px,2.5vw,50px);line-height:1;letter-spacing:.04em}
h1 span{color:var(--c4)}
.meta{display:flex;flex-wrap:wrap;gap:1.6vw;align-items:baseline;font-family:var(--label)}
.bars{display:flex;gap:6px}
.bars a{font-family:var(--label);font-size:clamp(12px,.95vw,19px);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:.15em .7em;border:1.5px dashed var(--dim);border-radius:6px}
.bars a.on{color:var(--slate);background:var(--chalk);border:1.5px solid var(--chalk)}
.bars a:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
#count{color:var(--dim);font-size:clamp(13px,1.1vw,22px)}
#clock{font-family:var(--label);font-weight:500;font-size:clamp(20px,1.9vw,38px)}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;column-gap:3vw}
.col{min-width:0;display:flex;flex-direction:column}
.head,.tap{display:grid;grid-template-columns:clamp(30px,2.8vw,56px) minmax(0,1fr) clamp(48px,4.4vw,88px) clamp(56px,5vw,100px) clamp(56px,5vw,100px);column-gap:.9vw;align-items:center}
.head{font-family:var(--label);color:var(--dim);font-size:clamp(13px,1.15vw,22px);letter-spacing:.06em;padding-bottom:.4vh;border-bottom:1.5px solid var(--grid)}
.head span:nth-child(n+3){text-align:center;white-space:nowrap}
.taps{flex:1;min-height:0;display:grid;list-style:none;margin:0;padding:0}
.tap{min-width:0;border-bottom:1.5px solid var(--grid)}
.num{font-family:var(--label);font-weight:500;color:var(--chalk);font-size:clamp(22px,2.4vw,46px);font-variant-numeric:tabular-nums}
.name{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:.1vh;overflow:hidden}
.line{display:inline-flex;align-items:center;gap:.6vw;width:max-content}
.beer{font-size:calc(clamp(24px,2.8vw,54px)*var(--z,1));line-height:1;white-space:nowrap;flex:none}
.ico{flex:none;width:clamp(28px,3vw,58px);height:clamp(28px,3vw,58px);fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.brew{font-size:clamp(14px,1.3vw,25px);color:var(--dim);display:flex;align-items:baseline;gap:.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1}
.bw{font-size:calc(1.1em*var(--z,1));color:inherit}
.st{font-family:var(--label);font-size:.85em;letter-spacing:.02em;color:var(--dim)}
.style{font-family:var(--hand);font-size:clamp(15px,1.45vw,29px);text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abv,.p{font-family:var(--label);font-weight:500;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.abv{font-size:clamp(18px,1.9vw,38px)}
.p{font-size:clamp(22px,2.5vw,48px);color:var(--chalk)}
.na{opacity:.35}
footer{font-family:var(--label);color:var(--dim);font-size:clamp(11px,.9vw,18px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.msg{color:var(--dim);font-size:clamp(16px,1.4vw,28px)}

@media (max-width:900px),(orientation:portrait){
  body{overflow:auto}
  .board{height:auto}
  .cols{grid-template-columns:1fr}
  .col+.col .head{display:none}
  .head,.tap{grid-template-columns:28px minmax(0,1fr) 44px 44px 44px;column-gap:8px}
  .tap{padding-block:8px}
  .name{flex-wrap:wrap}
  .beer{font-size:calc(22px*var(--z,1));white-space:normal}
  .ico{width:24px;height:24px}.brew{font-size:13px}
  .num{font-size:20px}.abv{font-size:16px}.p{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.tap{transition:opacity .4s}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="chalk" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter></svg>
<div class="board">
  <header>
    <h1>Сегодня <span>на кранах</span></h1>
    <div class="meta">
      <nav class="bars" id="bars"><a href="#13rules" id="b-13rules">13rules</a><a href="#epo" id="b-epo">Ещё по одной</a></nav>
      <span id="count"></span><span id="clock">--:--</span>
    </div>
  </header>
  <div class="cols" id="cols"><p class="msg">Загружаю краны…</p></div>
  <footer><span>крепость в %, цены в рублях</span><span id="foot"></span></footer>
</div>

<script>
// Данные лежат в data.json рядом со страницей: краны каждого бара из GainUp (Продажи → Краны),
// цены за литр из GainUp, стиль и крепость из Untappd. Страница перечитывает файл каждые 5 минут.
// У каждого сорта свой «почерк» и цвет мелка — выбираются по названию, поэтому не прыгают между обновлениями
const FONTS=[
  {f:"'Caveat',cursive",z:1.12,x:"font-weight:700"},
  {f:"'Neucha',cursive",z:1.0},
  {f:"'Amatic SC',cursive",z:1.2,x:"font-weight:700;letter-spacing:.03em"},
  {f:"'Pangolin',cursive",z:.95}
];
// Контурные «меловые» рисунки, viewBox 0 0 32 32, рисуются цветом сорта (currentColor)
const ICONS={
 mug:'<path d="M7 9h14v17a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M21 13h3a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-3"/><path d="M6 9c0-3 3-5 6-4 1-2 5-2 6 0 3-1 5 1 4 4"/><path d="M11 14v9M15 14v9"/>',
 wheat:'<path d="M16 30V9"/><path d="M16 12c-4-1-5-4-5-6 3 0 5 2 5 6zM16 12c4-1 5-4 5-6-3 0-5 2-5 6z"/><path d="M16 18c-4-1-5-4-5-6 3 0 5 2 5 6zM16 18c4-1 5-4 5-6-3 0-5 2-5 6z"/><path d="M16 24c-4-1-5-4-5-6 3 0 5 2 5 6zM16 24c4-1 5-4 5-6-3 0-5 2-5 6z"/><path d="M16 6V2"/>',
 hop:'<path d="M16 3v4"/><path d="M16 7c-6 2-8 8-6 14 1 4 4 7 6 8 2-1 5-4 6-8 2-6 0-12-6-14z"/><path d="M11 12h10M10 17h12M11 22h10"/><path d="M16 7c2-3 6-3 8-1"/>',
 banana:'<path d="M5 9c2 11 12 18 23 13"/><path d="M5 9c4 7 12 11 21 9"/><path d="M28 22c-1 0-1-2-2-4"/><path d="M5 9l-1-3 2-1 1 3"/>',
 cat:'<path d="M7 28V13l-2-8 6 4h10l6-4-2 8v15z"/><circle cx="12" cy="16" r="1.4"/><circle cx="20" cy="16" r="1.4"/><path d="M15 20h2l-1 1.5z"/><path d="M3 19l6 1M3 23l6-1M29 19l-6 1M29 23l-6-1"/>',
 popcorn:'<path d="M8 13l3 16h10l3-16z"/><path d="M12 13l1 16M20 13l-1 16"/><path d="M8 13c-3-3 0-7 3-5 0-4 5-4 5-1 1-3 6-2 5 1 3-1 5 3 3 5"/>',
 bee:'<ellipse cx="16" cy="19" rx="7" ry="9"/><path d="M9.5 16h13M9 21h14M11 25.5h10"/><path d="M14 10c-3-5-8-4-8 0 0 3 4 4 8 2M18 10c3-5 8-4 8 0 0 3-4 4-8 2"/><path d="M14 6l-2-3M18 6l2-3"/>',
 raspberry:'<circle cx="12" cy="14" r="3"/><circle cx="18" cy="14" r="3"/><circle cx="15" cy="19" r="3"/><circle cx="10" cy="20" r="3"/><circle cx="20" cy="20" r="3"/><circle cx="15" cy="25" r="3"/><path d="M15 11c-2-3-5-4-7-3M15 11c2-3 5-4 7-3M15 11V6"/>',
 cherry:'<circle cx="10" cy="23" r="5"/><circle cx="22" cy="21" r="5"/><path d="M10 18c2-7 6-12 10-14M22 16c-1-5-1-9-2-12"/><path d="M20 4c3 0 6 2 7 5-3 1-6 0-7-5z"/>',
 apricot:'<path d="M16 9c-7-2-12 4-11 11 1 6 6 9 11 8 5 1 10-2 11-8 1-7-4-13-11-11z"/><path d="M16 9c-1 6 0 13 1 19"/><path d="M16 9c1-3 3-5 6-6 0 3-2 5-6 6z"/>',
 tomato:'<circle cx="16" cy="19" r="10"/><path d="M16 9l-2-3M16 9l-5 0M16 9l5 0M16 9l-3 3M16 9l3 3M16 9l1-4"/>',
 apple:'<path d="M16 10c-4-3-11-1-11 7 0 7 5 12 8 12 2 0 2-1 3-1s1 1 3 1c3 0 8-5 8-12 0-8-7-10-11-7z"/><path d="M16 10c0-3 1-5 3-7"/><path d="M17 6c3-2 6-1 7 1-3 2-5 1-7-1z"/>',
 ufo:'<ellipse cx="16" cy="17" rx="13" ry="4"/><path d="M9 15c0-5 3-8 7-8s7 3 7 8"/><circle cx="10" cy="18" r=".8"/><circle cx="16" cy="19" r=".8"/><circle cx="22" cy="18" r=".8"/><path d="M11 22l-3 7M21 22l3 7M16 23v6"/>',
 key:'<circle cx="9" cy="16" r="6"/><circle cx="9" cy="16" r="2"/><path d="M15 16h14M25 16v5M21 16v4"/>',
 door:'<path d="M8 29V5h16v24"/><path d="M5 29h22"/><circle cx="20" cy="17" r="1.3"/><path d="M11 9h10v7H11z"/>',
 turtle:'<path d="M5 21c0-7 5-12 11-12s11 5 11 12z"/><path d="M5 21h22"/><path d="M11 13l5 4 5-4M16 17v4M9 21l2-4M23 21l-2-4"/><path d="M27 19c2-1 4 0 4 2s-2 2-4 1"/><path d="M8 21l-1 4M22 21l1 4"/>',
 sheep:'<path d="M8 20c-3 0-4-3-2-5-2-2 0-5 3-4 0-3 4-4 6-2 2-2 6-1 6 2 3-1 5 2 3 4 2 2 0 5-3 5z"/><path d="M23 13c2-1 5 0 5 3s-3 4-5 2"/><path d="M10 20v7M13 20v7M18 20v7M21 20v7"/>',
 feijoa:'<path d="M9 22c-3-6 1-15 8-16s10 7 7 14c-2 6-12 9-15 2z"/><path d="M23 7l2-3M24 8l3-2M22 6l1-4"/><path d="M12 20c2 1 5 1 7-1"/>',
 crown:'<path d="M5 24l-1-14 7 6 5-9 5 9 7-6-1 14z"/><path d="M5 28h22"/><circle cx="4" cy="9" r="1.4"/><circle cx="16" cy="6" r="1.4"/><circle cx="28" cy="9" r="1.4"/>',
 tram:'<rect x="7" y="9" width="18" height="16" rx="3"/><path d="M7 17h18"/><path d="M11 9h10l-1 0"/><path d="M12 12h3M17 12h3"/><circle cx="11" cy="21" r="1.2"/><circle cx="21" cy="21" r="1.2"/><path d="M10 25l-2 4M22 25l2 4M13 9l3-5 3 5M10 4h12"/>',
 ticket:'<path d="M4 9h24v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6z"/><path d="M11 9v14" stroke-dasharray="2 2"/><path d="M15 14h9M15 18h6"/>',
 lemon:'<path d="M5 16c0-6 5-10 11-10s11 4 11 10-5 10-11 10S5 22 5 16z"/><path d="M3 16h2M27 16h2"/><path d="M11 13c2-2 5-3 8-2"/>',
 chili:'<path d="M23 7c-3 0-4 3-5 7-2 7-7 11-14 13 9 2 18-3 20-11 1-4 1-7-1-9z"/><path d="M23 7c0-2 1-4 3-5"/><path d="M21 8c1-2 4-2 5 0"/>',
 bubbles:'<circle cx="11" cy="22" r="5"/><circle cx="21" cy="14" r="4"/><circle cx="12" cy="9" r="2.5"/><circle cx="24" cy="25" r="2"/><circle cx="20" cy="4" r="1.5"/>',
 bean:'<ellipse cx="16" cy="16" rx="8" ry="12" transform="rotate(30 16 16)"/><path d="M11 7c4 4 2 9 0 12-2 3-1 6 2 8" transform="rotate(30 16 16) translate(5 0)"/>',
 feather:'<path d="M26 4C14 6 7 15 6 26c9-2 18-9 20-22z"/><path d="M6 26L22 10"/><path d="M12 20h6M15 15h6M18 11h5"/>',
 star:'<path d="M16 3l4 8.5 9 1.2-6.6 6.3 1.7 9L16 23.5 7.9 28l1.7-9L3 12.7l9-1.2z"/>',
 calendar:'<rect x="5" y="7" width="22" height="21" rx="2"/><path d="M5 13h22M11 4v6M21 4v6"/><path d="M11 18h3v3h-3z"/>',
 clover:'<circle cx="16" cy="10" r="5"/><circle cx="10" cy="17" r="5"/><circle cx="22" cy="17" r="5"/><path d="M16 18c0 5 1 8 3 11"/>',
 badge:'<circle cx="16" cy="13" r="9"/><path d="M11 21l-3 8 5-2 3 4 2-9M21 21l3 8-5-2"/><path d="M12 13l3 3 5-6"/>',
 shamrock:'<path d="M16 15c-3-5-10-4-9 1 1 4 6 3 9-1zM16 15c3-5 10-4 9 1-1 4-6 3-9-1zM16 15c-4-3-4-11 0-11s4 8 0 11z"/><path d="M16 15c1 6 3 10 6 13"/>',
 glass:'<path d="M9 4h14l-2 24H11z"/><path d="M10 10h12"/><path d="M13 15v8M17 14v10"/>',
 jar:'<path d="M9 10h14v15a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z"/><path d="M8 6h16v4H8z"/><path d="M13 16c1 2 5 2 6 0M12 21h8"/>'
};
// запасной рисунок по стилю, если для сорта картинка не выбрана
const styleIcon=st=>{st=(st||"").toLowerCase();return /пшенич|вайцен|витбир|weiz/.test(st)?"wheat":/ipa|pale|эль/.test(st)?"hop":/стаут|портер/.test(st)?"bean":/сидр/.test(st)?"apple":/медовух/.test(st)?"bee":/гозе|сауэр|sour/.test(st)?"lemon":"mug"};
const icon=k=>`<svg class="ico" viewBox="0 0 32 32" aria-hidden="true" filter="url(#chalk)">${ICONS[k]||ICONS.mug}</svg>`;
const hash=s=>{let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,suf="")=>v==null?"—":String(v).replace(".",",")+suf;
const cell=(v,suf,lbl)=>`<span${v==null?' class="na"':''}${lbl?` data-l="${lbl}"`:''}>${fmt(v,suf)}</span>`;
let DATA=null, lastStamp=null;
const barId=()=>{const h=location.hash.slice(1);return DATA&&DATA.bars[h]?h:"13rules"};
function render(){
  if(!DATA) return;
  const id=barId(), bar=DATA.bars[id];
  document.querySelectorAll("#bars a").forEach(a=>a.classList.toggle("on",a.id==="b-"+id));
  const taps=bar.taps.map(([n,name,pl])=>{const b=DATA.beers[name]||[ "", name.replace(/\s*розлив\s*$/i,""), "", null ];return {n,brew:b[0],beer:b[1],style:b[2],abv:b[3],ic:b[4]||styleIcon(b[2]),pl}});
  const half=Math.ceil(taps.length/2);
  const root=document.getElementById("cols");root.innerHTML="";
  [taps.slice(0,half),taps.slice(half)].forEach(list=>{
    const col=document.createElement("div");col.className="col";
    col.innerHTML=`<div class="head"><span>№</span><span>СОРТ</span><span>КРЕП.</span><span>0,25 л</span><span>0,4 л</span></div>`;
    const ul=document.createElement("ul");ul.className="taps";ul.style.gridTemplateRows=`repeat(${half},minmax(0,1fr))`;
    for(const t of list){
      const p25=t.pl==null?null:Math.ceil(t.pl*0.25-1e-9), p40=t.pl==null?null:Math.ceil(t.pl*0.4-1e-9);
      const li=document.createElement("li");li.className="tap";
      
      const k=hash(t.beer+t.brew), font=FONTS[k%FONTS.length], col="var(--c"+(1+Math.floor(k/7)%8)+")";
      li.innerHTML=`<span class="num">${t.n}</span>
        <span class="name" style="color:${col}"><span class="line"><span class="beer" style="font-family:${font.f};--z:${font.z};${font.x||""}">${esc(t.beer)}</span>${icon(t.ic)}</span><span class="brew"><span class="bw" style="font-family:${font.f};--z:${font.z};${font.x||""}">${esc(t.brew||"")}</span>${t.style?`<span class="st">${esc(t.style)}</span>`:""}</span></span>
        <span class="abv${t.abv==null?' na':''}" style="color:${col}">${fmt(t.abv,"%")}</span>
        <span class="p${p25==null?' na':''}">${fmt(p25)}</span>
        <span class="p${p40==null?' na':''}">${fmt(p40)}</span>`;
      ul.appendChild(li);
    }
    col.appendChild(ul);root.appendChild(col);
  });
  // длинные названия ужимаем, чтобы влезали целиком
  document.querySelectorAll(".tap .line").forEach(ln=>{const el=ln.querySelector(".beer");let f=parseFloat(getComputedStyle(el).fontSize);const w=ln.parentElement.clientWidth;while(ln.getBoundingClientRect().width>w&&f>12){f-=1;el.style.fontSize=f+"px"}});
  document.getElementById("count").textContent=bar.title+" · "+taps.length+" сортов";
  const d=new Date(DATA.updated);
  document.getElementById("foot").textContent="Обновлено "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    if(j.updated!==lastStamp){DATA=j;lastStamp=j.updated;render();}
  }catch(e){
    if(!DATA) document.getElementById("cols").innerHTML='<p class="msg">Не удалось загрузить список кранов. Страница попробует снова через минуту.</p>';
    setTimeout(load,60000);return;
  }
}
load();setInterval(load,5*60000);
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{clearTimeout(window.__rt);window.__rt=setTimeout(render,200)});
if(document.fonts)document.fonts.ready.then(render);
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
// раз в 6 часов перезагружаем страницу целиком, чтобы ТВ подхватывал правки оформления
setTimeout(()=>location.reload(),6*3600*1000);
</script>
</body>
</html>
