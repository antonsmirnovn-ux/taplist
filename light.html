<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тап-лист на ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Oswald:wght@400;500&display=swap">
<style>
/* Layout: black felt letterboard in a thin frame; white condensed caps in grooves; two columns of taps, prices flush right */
:root{
  --glow:#d9cfb9;
  --glow-edge:#a99d84;
  --ink:#1c1813;
  --dim:#5e5444;
  --rail:#5a4a36;
  --rail-dark:#3a2f22;
  --frame:#15130f;
  --title:"Jost","Futura","Century Gothic",sans-serif;
  --letters:"Oswald","Roboto Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d0b09;color:var(--ink);font-family:var(--letters);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.frame{height:100%;padding-block:1.2vh}
/* приглушённый лайтбокс: тёплый свет в центре, к краям темнеет */
.board{height:100%;max-width:1900px;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(85% 75% at 50% 45%,var(--glow) 0%,#cbbfa6 55%,var(--glow-edge) 100%);
  border:clamp(8px,.9vw,18px) solid var(--frame);
  box-shadow:inset 0 0 60px rgba(40,28,10,.45),0 0 0 1px #000;
  padding:1.2vh 2.4vw .8vh}
header{display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:.4vh}
h1{margin:0;font-family:var(--title);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(28px,3.4vw,68px);line-height:1;color:var(--ink)}
.side{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.side>*{pointer-events:auto}
.bars{display:flex;gap:6px}
.bars a{font-family:var(--letters);text-transform:uppercase;letter-spacing:.12em;font-size:clamp(10px,.8vw,16px);color:var(--dim);text-decoration:none;padding:.2em .7em;border:1px solid var(--dim)}
.bars a.on{color:var(--glow);background:var(--ink);border-color:var(--ink)}
.bars a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#clock{font-family:var(--letters);letter-spacing:.14em;font-size:clamp(16px,1.7vw,34px);font-variant-numeric:tabular-nums}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;column-gap:3vw}
.col{min-width:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:clamp(34px,3.2vw,64px) minmax(0,1fr) clamp(62px,5.6vw,112px) clamp(64px,5.8vw,116px) clamp(64px,5.8vw,116px);column-gap:.8vw;align-items:center;text-transform:uppercase}
/* направляющие-рейки, в которые вставлены буквы */
.rail{height:clamp(6px,.85vh,10px);background:linear-gradient(var(--rail),var(--rail-dark));box-shadow:0 1px 2px rgba(0,0,0,.35)}
.head{color:var(--dim);font-size:clamp(11px,.95vw,19px);letter-spacing:.14em;padding-block:.2vh .3vh}
.head span:nth-child(n+3){text-align:right}
.taps{flex:1;min-height:0;display:grid;list-style:none;margin:0;padding:0}
.tap{min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.tap .row{flex:1;min-height:0}
.name{min-width:0;overflow:hidden}
.name>span{display:inline-block;white-space:nowrap;transform-origin:left center}
.r{text-align:right;white-space:nowrap}
/* каждая буква — отдельная карточка: чуть разная посадка и наклон, едва заметный край пластика */
.t{display:inline-block;font-weight:500;line-height:1;padding:0 .045em;margin:0 .03em;
   background:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.03));
   box-shadow:inset 0 0 0 1px rgba(60,45,25,.10);
   transform:translateY(var(--y,0)) rotate(var(--a,0deg))}
.sp{display:inline-block;width:.42em}
.num .t{font-size:clamp(20px,2vw,40px)}
.name .t{font-size:clamp(22px,2.55vw,50px)}
.abv .t{font-size:clamp(16px,1.6vw,32px);color:var(--dim)}
.p .t{font-size:clamp(22px,2.55vw,50px)}
.na{opacity:.35}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:clamp(10px,.8vw,16px);letter-spacing:.12em;text-transform:uppercase;padding-top:.5vh}
.msg{color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:clamp(14px,1.3vw,26px)}

@media (max-width:900px),(orientation:portrait){
  body{overflow:auto}
  .frame,.board{height:auto}
  .cols{grid-template-columns:1fr}
  .col+.col .head{display:none}
  .side{position:static;margin-top:8px}
  header{flex-direction:column}
  .row{grid-template-columns:28px minmax(0,1fr) 46px 48px 48px;column-gap:6px}
  .tap .row{padding-block:8px}
  .name>span{white-space:normal}
  .name .t{font-size:18px}.num .t{font-size:16px}.abv .t{font-size:13px}.p .t{font-size:17px}
}
</style>
</head>
<body>
<div class="frame"><div class="board">
  <header>
    <h1>На кранах</h1>
    <div class="side">
      <nav class="bars" id="bars"><a href="#13rules" id="b-13rules">13rules</a><a href="#epo" id="b-epo">Ещё по одной</a></nav>
      <span id="clock">--:--</span>
    </div>
  </header>
  <div class="cols" id="cols"><p class="msg">Загружаю краны…</p></div>
  <footer><span>Крепость в % · цены в рублях</span><span id="foot"></span></footer>
</div></div>

<script>
// Данные лежат в data.json рядом со страницей: краны каждого бара из GainUp (Продажи → Краны),
// цены за литр из GainUp, крепость из Untappd. Страница перечитывает файл каждые 5 минут.
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,suf="")=>v==null?"—":String(v).replace(".",",")+suf;
// разбить текст на «карточки»; посадка каждой буквы своя, но постоянная (зависит от текста и позиции)
const tiles=(str,seed)=>{let h=seed*2654435761>>>0;return [...String(str).toUpperCase()].map((c,i)=>{if(c===" ")return '<span class="sp"></span>';h=(Math.imul(h^c.codePointAt(0),2246822519)+i*374761393)>>>0;const y=((h%7)-3)*.012,a=(((h>>>8)%9)-4)*.12;return `<span class="t" style="--y:${y.toFixed(3)}em;--a:${a.toFixed(2)}deg">${esc(c)}</span>`}).join("")};
let DATA=null,lastStamp=null;
const barId=()=>{const h=location.hash.slice(1);return DATA&&DATA.bars[h]?h:"13rules"};
function fit(){
  // длинные названия ужимаем по ширине, не меняя высоту букв слишком сильно
  document.querySelectorAll(".tap .name").forEach(box=>{const t=box.firstElementChild;t.style.transform="";const w=box.clientWidth,tw=t.scrollWidth;if(tw>w){t.style.transform=`scaleX(${Math.max(.62,w/tw)})`;}});
}
function render(){
  if(!DATA)return;
  const id=barId(),bar=DATA.bars[id];
  document.querySelectorAll("#bars a").forEach(a=>a.classList.toggle("on",a.id==="b-"+id));
  const taps=bar.taps.map(([n,name,pl])=>{const b=DATA.beers[name]||["",name.replace(/\s*розлив\s*$/i,""),"",null];return {n,beer:b[1],abv:b[3],pl}});
  const half=Math.ceil(taps.length/2),root=document.getElementById("cols");root.innerHTML="";
  [taps.slice(0,half),taps.slice(half)].forEach(list=>{
    const col=document.createElement("div");col.className="col";
    col.innerHTML=`<div class="row head"><span>№</span><span>сорт</span><span>алк.</span><span>0,25 л</span><span>0,4 л</span></div><div class="rail"></div>`;
    const ul=document.createElement("ul");ul.className="taps";ul.style.gridTemplateRows=`repeat(${half},minmax(0,1fr))`;
    for(const t of list){
      const p25=t.pl==null?null:Math.ceil(t.pl*.25-1e-9),p40=t.pl==null?null:Math.ceil(t.pl*.4-1e-9);
      const li=document.createElement("li");li.className="tap";
      li.innerHTML=`<div class="row"><span class="num">${tiles(t.n,t.n)}</span><span class="name"><span>${tiles(t.beer,t.n+1)}</span></span><span class="r abv${t.abv==null?' na':''}">${tiles(fmt(t.abv,"%"),t.n+2)}</span><span class="r p${p25==null?' na':''}">${tiles(fmt(p25),t.n+3)}</span><span class="r p${p40==null?' na':''}">${tiles(fmt(p40),t.n+4)}</span></div><div class="rail"></div>`;
      ul.appendChild(li);
    }
    col.appendChild(ul);root.appendChild(col);
  });
  fit();
  const d=new Date(DATA.updated);
  document.getElementById("foot").textContent=bar.title+" · обновлено "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(j.updated!==lastStamp){DATA=j;lastStamp=j.updated;render();}
  }catch(e){
    if(!DATA)document.getElementById("cols").innerHTML='<p class="msg">Не удалось загрузить список кранов. Пробую снова через минуту.</p>';
    setTimeout(load,60000);
  }
}
load();setInterval(load,5*60000);
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{clearTimeout(window.__rt);window.__rt=setTimeout(fit,200)});
if(document.fonts)document.fonts.ready.then(fit);
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
setTimeout(()=>location.reload(),6*3600*1000);
</script>
</body>
</html>
